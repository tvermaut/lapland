name: Airtable to JSON Sync

on:
  schedule:
    - cron: '0 * * * *' # Elk uur
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run Sync Script
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: python sync_airtable.py

      - name: Commit and Push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Controleer of data.json is gewijzigd
          if git diff --exit-code data.json; then
            echo "Geen wijzigingen om te committen."
          else
            git add data.json
            git commit -m "Automatische update: Airtable data gewijzigd"
            git push
          fi
